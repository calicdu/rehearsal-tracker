<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="#090d16" />
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#card-grad)" stroke="#312e81" stroke-width="4" />

  <!-- Outer circular orbit representing rotation -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#4f46e5" stroke-width="6" stroke-dasharray="16 12" opacity="0.4" />

  <!-- Center Glow -->
  <circle cx="256" cy="256" r="120" fill="url(#bg-grad)" filter="url(#glow)" opacity="0.25" />

  <!-- Electric Guitar Silhouette & Rotation Symbol -->
  <g transform="translate(256, 256)">
    <!-- Rotating Arrows around the center -->
    <path d="M 0,-150 A 150 150 0 0 1 150,0" fill="none" stroke="#6366f1" stroke-width="14" stroke-linecap="round" />
    <polygon points="150,-15 168,10 132,10" fill="#6366f1" transform="rotate(90, 150, 0)" />

    <path d="M 0,150 A 150 150 0 0 1 -150,0" fill="none" stroke="#a5b4fc" stroke-width="14" stroke-linecap="round" />
    <polygon points="-150,15 -132,-10 -168,-10" fill="#a5b4fc" transform="rotate(90, -150, 0)" />

    <!-- Musical Note & Coin / Payer badge in center -->
    <circle cx="0" cy="0" r="84" fill="#0f172a" stroke="#6366f1" stroke-width="8" />
    
    <!-- Dollar / Pay / Music emblem -->
    <path d="M-15,-35 L15,-35 M0,-45 L0,45 M-25,-12 C-25,-30 25,-30 25,-10 C25,12 -25,8 -25,28 C-25,44 25,44 25,28" 
          fill="none" stroke="#38bdf8" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
