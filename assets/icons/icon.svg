<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Background rounded square -->
  <rect width="512" height="512" rx="128" fill="#090a0f" />
  <rect x="24" y="24" width="464" height="464" rx="104" fill="#11141c" stroke="#1f2433" stroke-width="8" />

  <!-- Clean Hardware Dial Outer Ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#1f2433" stroke-width="6" stroke-dasharray="8 12" />

  <!-- Rotation arrows in clean ice white and cyan -->
  <g transform="translate(256, 256)">
    <!-- Top arc and arrow (pure white) -->
    <path d="M 0,-140 A 140 140 0 0 1 140,0" fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round" />
    <polygon points="140,-18 162,10 120,10" fill="#ffffff" transform="rotate(82, 140, 0)" />

    <!-- Bottom arc and arrow (electric cyan) -->
    <path d="M 0,140 A 140 140 0 0 1 -140,0" fill="none" stroke="#38bdf8" stroke-width="18" stroke-linecap="round" />
    <polygon points="-140,18 -118,-10 -160,-10" fill="#38bdf8" transform="rotate(82, -140, 0)" />

    <!-- Center knob -->
    <circle cx="0" cy="0" r="76" fill="#090a0f" stroke="#1f2433" stroke-width="8" />
    
    <!-- Minimalist musical emblem in clean white -->
    <path d="M-8,-26 L18,-32 L18,12 C18,20 10,24 2,24 C-8,24 -14,18 -14,10 C-14,2 -6,-2 2,-2 L6,-2 L6,-20 L-8,-16 Z" 
          fill="#38bdf8" />
  </g>
</svg>
