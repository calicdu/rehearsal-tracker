<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Background rounded square -->
  <rect width="512" height="512" rx="128" fill="#0b0c0e" />
  <rect x="24" y="24" width="464" height="464" rx="104" fill="#141619" stroke="#24272d" stroke-width="8" />

  <!-- Clean Hardware Dial Outer Ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#24272d" stroke-width="6" stroke-dasharray="8 12" />

  <!-- Rotation arrows in crisp electric lime -->
  <g transform="translate(256, 256)">
    <!-- Top arc and arrow -->
    <path d="M 0,-140 A 140 140 0 0 1 140,0" fill="none" stroke="#d2f83c" stroke-width="18" stroke-linecap="round" />
    <polygon points="140,-18 162,10 120,10" fill="#d2f83c" transform="rotate(82, 140, 0)" />

    <!-- Bottom arc and arrow -->
    <path d="M 0,140 A 140 140 0 0 1 -140,0" fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round" opacity="0.8" />
    <polygon points="-140,18 -118,-10 -160,-10" fill="#ffffff" transform="rotate(82, -140, 0)" />

    <!-- Center hardware knob -->
    <circle cx="0" cy="0" r="76" fill="#0b0c0e" stroke="#24272d" stroke-width="8" />
    
    <!-- Minimalist musical note / guitar pick emblem -->
    <path d="M-8,-26 L18,-32 L18,12 C18,20 10,24 2,24 C-8,24 -14,18 -14,10 C-14,2 -6,-2 2,-2 L6,-2 L6,-20 L-8,-16 Z" 
          fill="#d2f83c" />
  </g>
</svg>
