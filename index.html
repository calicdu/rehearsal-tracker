<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Band Rehearsal Tracker</title>
    
    <!-- Mobile & PWA Configuration -->
    <meta name="theme-color" content="#0b0c0e">
    <meta name="description" content="Rotational payment queue for band rehearsals.">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Rehearsals">
    
    <!-- Favicon & Manifest -->
    <link rel="icon" type="image/svg+xml" href="./assets/icons/icon.svg">
    <link rel="apple-touch-icon" href="./assets/icons/icon.svg">
    <link rel="manifest" href="./manifest.json">

    <!-- Tailwind CSS (CDN for utility classes) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            base: '#0b0c0e',
                            surface: '#141619',
                            muted: '#191c20',
                            border: '#24272d',
                        },
                        accent: {
                            DEFAULT: '#d2f83c',
                            hover: '#bfe628',
                            dark: '#090a02',
                        }
                    }
                }
            }
        };
    </script>

    <!-- Custom Lean Stylesheet -->
    <link rel="stylesheet" href="./src/styles.css">
</head>
<body class="min-h-screen bg-[#0b0c0e] text-[#f4f4f6] flex flex-col justify-between antialiased selection:bg-[#d2f83c] selection:text-black safe-top safe-bottom">

    <!-- Application Root Container (Mobile-First: Max 480px width on desktop, 100% on phones) -->
    <div id="root" class="w-full max-w-lg mx-auto min-h-screen flex flex-col justify-between px-3.5 sm:px-4"></div>

    <!-- Floating Toast Container -->
    <div id="toast-container" class="fixed bottom-5 left-1/2 -translate-x-1/2 z-50 pointer-events-auto max-w-sm w-full px-4"></div>

    <!-- Core App Scripts -->
    <script src="./src/icons.js"></script>
    <script src="./src/app.js"></script>
</body>
</html>
