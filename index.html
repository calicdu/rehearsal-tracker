<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Rehearsal Payment Tracker</title>
    
    <!-- Mobile & PWA Configuration -->
    <meta name="theme-color" content="#090a0f">
    <meta name="description" content="Rotational payment queue for band rehearsals.">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Rehearsals">
    
    <!-- Favicon & Manifest -->
    <link rel="icon" type="image/svg+xml" href="./assets/icons/icon.svg">
    <link rel="apple-touch-icon" href="./assets/icons/icon.svg">
    <link rel="manifest" href="./manifest.json">

    <!-- Modern Typography: Geist & Geist Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Tailwind CSS (CDN for utility classes) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Geist', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
                        mono: ['Geist Mono', 'ui-monospace', 'monospace'],
                    }
                }
            }
        };
    </script>

    <!-- Custom Modern Stylesheet -->
    <link rel="stylesheet" href="./src/styles.css">
</head>
<body class="bg-[#090a0f] text-[#f8fafc] antialiased selection:bg-[#d4d9e1] selection:text-black safe-top safe-bottom">

    <!-- Application Root Container -->
    <div id="root" class="w-full max-w-lg mx-auto flex flex-col px-3.5 sm:px-4"></div>

    <!-- Floating Toast Container -->
    <div id="toast-container" class="fixed bottom-5 left-1/2 -translate-x-1/2 z-50 pointer-events-auto max-w-sm w-full px-4"></div>

    <!-- Core App Scripts -->
    <script src="./src/config.js"></script>
    <script src="./src/icons.js"></script>
    <script src="./src/app.js"></script>
</body>
</html>
